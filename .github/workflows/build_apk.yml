name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📱 Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📜 Force Accept All SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🔑 Setup Keystore & Google Services
        run: |
          # 1. إنشاء debug.keystore في الجذر والمجلد الافتراضي
          if [ ! -f "debug.keystore" ]; then
            echo "Creating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          fi

          # 2. استخراج اسم الحزمة تلقائيًا لملف google-services.json الوهمي
          PACKAGE_NAME=$(grep -oP 'namespace\s*=?\s*["\']\K[^"\']+' app/build.gradle* 2>/dev/null || echo "com.example.app")

          # 3. إنشاء google-services.json إذا لم يكن موجودًا
          mkdir -p app/
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"$PACKAGE_NAME"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"analytics_service":{"status":1}}}]}" > app/google-services.json
          fi

      - name: 🔧 Setup & Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found, generating..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: 🏗️ Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          echo "Building APK for mode: $BUILD_TYPE..."
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: 🔍 Locate Built APK
        id: find_apk
        run: |
          echo "Listing generated APK files:"
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_filename=$(basename $APK_FILE)" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: 📝 Add Build Summary
        run: |
          echo "### 🚀 Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`${{ steps.find_apk.outputs.apk_filename }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Mode:** \`${{ github.event.inputs.build_type || 'debug' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
