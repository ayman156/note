name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # Java
      # --------------------------------------------------

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # Accept Android SDK licenses
      # --------------------------------------------------

      - name: 📜 Accept Android SDK Licenses
        shell: bash
        run: |
          set +e

          yes | sdkmanager --licenses >/dev/null 2>&1

          exit 0

      # --------------------------------------------------
      # Detect Android SDK requirements
      # --------------------------------------------------

      - name: 🔍 Detect Android SDK Configuration
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed || true

      # --------------------------------------------------
      # Install common Android SDK components
      # --------------------------------------------------

      - name: 📦 Install Android SDK Components
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"

          # Install common Android platforms/build tools.
          # If your project uses another compileSdk, add it here.

          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # --------------------------------------------------
      # Debug Keystore
      # --------------------------------------------------

      - name: 🔑 Setup Debug Keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already exists."
          fi

      # --------------------------------------------------
      # Google Services
      # --------------------------------------------------

      - name: 🔑 Setup Google Services
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          mkdir -p app

          # If the repository already contains google-services.json,
          # don't overwrite it.

          if [ -f "app/google-services.json" ]; then
            echo "Existing google-services.json found."
            exit 0
          fi

          # If a secret was provided, decode it.

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Creating google-services.json from GitHub Secret."

            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

            exit 0
          fi

          # --------------------------------------------------
          # Create a dummy configuration only if necessary.
          # This prevents Firebase/Google Services from failing
          # when the project does not actually use Firebase.
          # --------------------------------------------------

          PACKAGE_NAME="com.example.app"

          if [ -f "app/build.gradle" ]; then
            DETECTED_PACKAGE=$(grep -oP 'namespace\s*[=:]\s*["'\'']\K[^"'\'']+' app/build.gradle | head -n 1 || true)

            if [ -n "$DETECTED_PACKAGE" ]; then
              PACKAGE_NAME="$DETECTED_PACKAGE"
            fi
          fi

          if [ -f "app/build.gradle.kts" ]; then
            DETECTED_PACKAGE=$(grep -oP 'namespace\s*=\s*["'\'']\K[^"'\'']+' app/build.gradle.kts | head -n 1 || true)

            if [ -n "$DETECTED_PACKAGE" ]; then
              PACKAGE_NAME="$DETECTED_PACKAGE"
            fi
          fi

          echo "Detected package: $PACKAGE_NAME"

          cat > app/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "0",
              "project_id": "dummy",
              "storage_bucket": "dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0",
                  "android_client_info": {
                    "package_name": "$PACKAGE_NAME"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  }
                }
              }
            ]
          }
          EOF

          echo "Dummy google-services.json created."

      # --------------------------------------------------
      # Gradle Wrapper
      # --------------------------------------------------

      - name: 🔧 Setup Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew was not found."
            echo "Please include the Gradle wrapper in the repository."
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew --version

      # --------------------------------------------------
      # Determine Build Type
      # --------------------------------------------------

      - name: 🧩 Determine Build Type
        id: build_type
        shell: bash
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="debug"
          fi

          echo "BUILD_TYPE=$BUILD_TYPE"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------

      - name: 🏗️ Build Android APK
        shell: bash
        run: |
          set -e

          BUILD_TYPE="${{ steps.build_type.outputs.build_type }}"

          echo "======================================"
          echo "Building Android APK"
          echo "Build type: $BUILD_TYPE"
          echo "======================================"

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      # --------------------------------------------------
      # Find APK
      # --------------------------------------------------

      - name: 🔍 Locate Built APK
        id: find_apk
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            -print

          APK_FILE=$(find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file was found."
            exit 1
          fi

          APK_FILE="${APK_FILE#./}"

          echo ""
          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$(basename "$APK_FILE")" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.build_type.outputs.build_type }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      # --------------------------------------------------
      # Build Summary
      # --------------------------------------------------

      - name: 📝 Add Build Summary
        shell: bash
        run: |
          echo "## 🚀 Android Build Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Type | \`${{ steps.build_type.outputs.build_type }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | \`${{ steps.find_apk.outputs.apk_filename }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered By | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"