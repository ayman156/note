name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # JDK 17
      # AGP 9.1.1 requires JDK 17
      # ==========================================

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================
      # Android SDK
      # ==========================================

      - name: 📱 Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      # ==========================================
      # Android SDK Licenses
      # ==========================================

      - name: 📜 Accept Android SDK Licenses
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          LICENSE_DIR="$ANDROID_HOME/licenses"

          mkdir -p "$LICENSE_DIR"

          # Android SDK license
          cat > "$LICENSE_DIR/android-sdk-license" <<'EOF'
          8933b5ace80cd055785009300d6432e1b86e6595
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63718c303d0806d510d49d37243f1ee2
          EOF

          # Android SDK Preview license
          cat > "$LICENSE_DIR/android-sdk-preview-license" <<'EOF'
          84831b9402116e267a9081e2617f69f2f9d64449
          EOF

          # Google TV
          cat > "$LICENSE_DIR/android-googletv-license" <<'EOF'
          6010077a03843d6ab4c074736f3334d9d69f2a52
          EOF

          # Try standard non-interactive acceptance as well
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "SDK licenses prepared."

      # ==========================================
      # Install Android 16 QPR2 / API 36.1
      # ==========================================

      - name: 📦 Install Android SDK 36.1
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Installing Android SDK Platform 36.1..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed

      # ==========================================
      # Install Gradle 9.3.1
      #
      # This intentionally does NOT use ./gradlew
      # because gradle-wrapper.jar is missing.
      # ==========================================

      - name: 🐘 Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      # ==========================================
      # Check Gradle
      # ==========================================

      - name: 🔍 Check Build Environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Java"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "Gradle"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "Android SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"

      # ==========================================
      # Debug Keystore
      # ==========================================

      - name: 🔑 Setup Debug Keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "Debug keystore already exists."

          fi

          # Your build.gradle.kts expects this file
          cp "$HOME/.android/debug.keystore" ./debug.keystore

      # ==========================================
      # Google Services
      # ==========================================

      - name: 🔑 Setup Google Services
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

        run: |
          set -e

          mkdir -p app

          # ------------------------------------------
          # Existing google-services.json
          # ------------------------------------------

          if [ -f "app/google-services.json" ]; then
            echo "Existing google-services.json found."
            exit 0
          fi

          # ------------------------------------------
          # GitHub Secret
          # ------------------------------------------

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then

            echo "Creating google-services.json from GitHub Secret."

            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

            exit 0

          fi

          # ------------------------------------------
          # Detect package name
          # ------------------------------------------

          PACKAGE_NAME="ayman.note"

          if [ -f "app/build.gradle.kts" ]; then

            DETECTED_PACKAGE=$(grep -oP \
              'applicationId\s*=\s*["'\'']\K[^"'\'']+' \
              app/build.gradle.kts \
              | head -n 1 || true)

            if [ -n "$DETECTED_PACKAGE" ]; then
              PACKAGE_NAME="$DETECTED_PACKAGE"
            fi

          elif [ -f "app/build.gradle" ]; then

            DETECTED_PACKAGE=$(grep -oP \
              'applicationId\s*[=:]\s*["'\'']\K[^"'\'']+' \
              app/build.gradle \
              | head -n 1 || true)

            if [ -n "$DETECTED_PACKAGE" ]; then
              PACKAGE_NAME="$DETECTED_PACKAGE"
            fi

          fi

          echo "Detected package: $PACKAGE_NAME"

          # ------------------------------------------
          # Dummy Google Services
          # ------------------------------------------

          cat > app/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "0",
              "project_id": "dummy",
              "storage_bucket": "dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0",
                  "android_client_info": {
                    "package_name": "$PACKAGE_NAME"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  }
                }
              }
            ]
          }
          EOF

          echo "Dummy google-services.json created."

      # ==========================================
      # Determine Build Type
      # ==========================================

      - name: 🧩 Determine Build Type
        id: build_type
        shell: bash
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="debug"
          fi

          echo "Build type: $BUILD_TYPE"

          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      # ==========================================
      # Build
      #
      # IMPORTANT:
      # Use "gradle", NOT "./gradlew"
      # ==========================================

      - name: 🏗️ Build Android APK
        shell: bash
        run: |
          set -e

          BUILD_TYPE="${{ steps.build_type.outputs.build_type }}"

          echo "=========================================="
          echo "Building Note A"
          echo "Package: ayman.note"
          echo "Build type: $BUILD_TYPE"
          echo "Gradle: 9.3.1"
          echo "AGP: 9.1.1"
          echo "Kotlin: 2.2.10"
          echo "Compile SDK: 36.1"
          echo "=========================================="

          if [ "$BUILD_TYPE" = "release" ]; then

            gradle assembleRelease \
              --stacktrace \
              --no-daemon

          else

            gradle assembleDebug \
              --stacktrace \
              --no-daemon

          fi

      # ==========================================
      # Locate APK
      # ==========================================

      - name: 🔍 Locate Built APK
        id: find_apk
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file was found."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$(basename "$APK_FILE")" >> "$GITHUB_OUTPUT"

      # ==========================================
      # Upload APK
      # ==========================================

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.build_type.outputs.build_type }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      # ==========================================
      # Summary
      # ==========================================

      - name: 📝 Add Build Summary
        shell: bash
        run: |
          echo "## 🚀 Android Build Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | \`ayman.note\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Type | \`${{ steps.build_type.outputs.build_type }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | \`${{ steps.find_apk.outputs.apk_filename }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gradle | \`9.3.1\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AGP | \`9.1.1\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kotlin | \`2.2.10\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compile SDK | \`36.1\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"